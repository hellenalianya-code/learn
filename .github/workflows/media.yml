name: Update README media

# Re-captures the screenshots and GIFs in docs/images when the app changes.
on:
  push:
    branches: [main]
    paths: ["teacher-portal/**", "dashboard/**", "scripts/capture.mjs"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: media
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run vendor
      - run: npm run capture
      - name: Commit new media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update README screenshots and GIFs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Redeploy the site with the new media
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
